    body { background-color: #000; color: white; font-family: Arial, sans-serif; margin: 0; overflow-x: auto; user-select: none; }
    .map-container { position: relative; width: 11500px; height: 2350px; background-color: #0b0c10; }

    /* --- ESTILO SEÑALES --- */
    .senal-unificada { position: absolute; display: flex; flex-direction: column; align-items: center; z-index: 150; }
    .nombre-s-abajo { flex-direction: column-reverse; }
    .s-nombre-real { color: #FFFF00; font-size: 10px; font-weight: bold; margin-bottom: -2px; text-shadow: 1px 1px 2px #000; }
    .s-grafico-real { display: flex; align-items: center; justify-content: center; }
    .t-girada { font-size: 35px; font-weight: bold; transform: rotate(-90deg); margin-right: -10px; line-height: 1; transition: 0.2s; }
    .circulo-led { width: 22px; height: 22px; border-radius: 50%; background-color: #200; transition: 0.2s; } 
    .curva-led {
        width: 14px; 
        height: 14px; 
        background-color: #B8F5B8;
        transition: 0.2s;
        border-radius: 0 14px 0 0; 
        margin-top: -1px;
        transform: rotate(-270deg);
    }

    /* --- SEÑALES ENANAS --- */
    .enana .t-girada { font-size: 22px !important; margin-right: -6px !important; }
    .enana .circulo-led { width: 14px !important; height: 14px !important; }
    .enana .curva-led { width: 14px !important; height: 14px !important; }
    .enana .s-nombre-real { font-size: 10px !important; }

    .sentido-izq .s-grafico-real { flex-direction: row-reverse; }
    .sentido-izq .t-girada { transform: rotate(90deg); margin-right: 0; margin-left: -10px; }

    /* ESTADOS DE COLORES SEÑALES */
    .f-rojo .t-girada { color: #FF0000 !important; }
    .f-rojo .circulo-led { background-color: #FF0000 !important; box-shadow: 0 0 15px #FF0000; }
    .f-rojo .curva-led { background-color: #FF0000 !important; box-shadow: 0 0 15px #FF0000; }

    .f-verde .t-girada { color: #00FF00 !important; }

    .f-maniobra .t-girada { color: #FFFF00 !important; }

    .f-maniobra .curva-led { background-color: #FFFF00 !important; box-shadow: 0 0 15px #FFFF00; }

    /* --- ESTILO VÍAS --- */
    .via { 
        position: absolute; 
        height: 10px; 
        background-color: #FF0000; 
        border: 1px solid #FF0000; 
        z-index: 30;

var firebaseConfig = {
    apiKey: "AIzaSyC2V...", 
    authDomain: "mi-ctc-ferroviario.firebaseapp.com",
    databaseURL: "https://mi-ctc-ferroviario-default-rtdb.firebaseio.com",

    storageBucket: "mi-ctc-ferroviario.appspot.com",
    messagingSenderId: "367332213795",
    appId: "1:367332213795:web:53177699e19cc174542289"
};

firebase.initializeApp(firebaseConfig);
var db = firebase.database();

const TABLA_CAMBIOS = {
    "W1": { pm: 'w1pm', plus: 'w1plus', minus: 'w1minus' },
    "W2": { pm: 'w2pm', plus: 'w2plus', minus: 'w2minus' }
};

var tic = true;
var curW = "1"; var flagAveria_Bel = 0; var w1_estado = 0; var w2_estado = 0;

function procesarCambioGeneral(id, conf, pos, estadoVia, averia, tic) {
    const pm = document.getElementById(conf.pm);
    const plus = document.getElementById(conf.plus);
    const minus = document.getElementById(conf.minus);
    if (!pm || !plus || !minus) return;

    const estadosCss = {
        0: 'libreconI',
        1: 'ocupado',
        2: 'libresinI',
        4: 'maniobra'
    };
    
    const colorEstado = estadosCss[estadoVia] || 'libreconI';
    const parpadeo = (averia && tic);

    [pm, plus, minus].forEach(el => el.classList.remove('via-fantasma', 'ocupado', 'libreconI', 'libresinI', 'maniobra'));

    if (pos == 1) {
        minus.classList.add('via-fantasma');
        if (parpadeo) {
            [pm, plus].forEach(el => el.classList.add('via-fantasma'));
        } else {
            [pm, plus].forEach(el => el.classList.add(colorEstado));
        }
    } else {
        plus.classList.add('via-fantasma');
        if (parpadeo) {
            [pm, minus].forEach(el => el.classList.add('via-fantasma'));
        } else {
            [pm, minus].forEach(el => el.classList.add(colorEstado));
        }
    }
}

setInterval(function() {
    tic = !tic;

    procesarCambioGeneral("W1", TABLA_CAMBIOS["W1"], curW, w1_estado, flagAveria_Bel == 1, tic);
    procesarCambioGeneral("W2", TABLA_CAMBIOS["W2"], curW, w2_estado, flagAveria_Bel == 1, tic);

    pW();
}, 500);

function pW() {
    var v1p = document.getElementById('w1plus'), v1m = document.getElementById('w1minus'), v1pm = document.getElementById('w1pm');
    var v2p = document.getElementById('w2plus'), v2m = document.getElementById('w2minus'), v2pm = document.getElementById('w2pm');
    var lp = document.getElementById('LW12P'), lm = document.getElementById('LW12M');
    var lAveria = document.getElementById('AW12');

    if(!v1p || !v2p || !v1pm || !v2pm) return;
    
    if(lAveria) {
        if (flagAveria_Bel == 1) {
            lAveria.classList.add('l-red');
        } else {
            lAveria.classList.remove('l-red');
        }
    }

    if(lp) { 
        lp.className = "led-rd"; 
        if (curW == "1" || curW == 1) lp.classList.add('l-white'); 
    }
    if(lm) { 
        lm.className = "led-rd"; 
        if (curW != "1" && curW != 1) lm.classList.add('l-white'); 
    }
}

function procesarEnclavamientosCambios(datosEnclav) {
    if (!datosEnclav) return;
    
    var parejasCambios = [
        { ids: ["EW1", "EW2"], claves: ["EW1", "ew1", "EW2", "ew2"] }
    ];

    function aplicarEstilo(el, activo) {
        if (!el) return;
        el.style.position = "relative";
        el.style.zIndex = "9999"; 

        if (activo) {
            el.style.backgroundColor = "#0000FF"; 
            el.style.borderColor = "#0000FF"; 
            el.style.boxShadow = "0 0 14px #0000FF";
        } else {
            el.style.backgroundColor = "#ffffff"; 
            el.style.borderColor = "#ffffff"; 
            el.style.boxShadow = "none";
        }
    }

    parejasCambios.forEach(function(pareja) {
        var encontrado = false; var estadoActive = false;
        pareja.claves.forEach(function(clave) {
            if (datosEnclav[clave] !== undefined) {
                encontrado = true;
                if (datosEnclav[clave] == 1) estadoActive = true;
            }
        });

        if (encontrado) {
            pareja.ids.forEach(function(idHtml) {
                var el = document.getElementById(idHtml);
                aplicarEstilo(el, estadoActive);
            });
        }
    });

    Object.keys(datosEnclav).forEach(function(idId) {
        if (!idId.toUpperCase().startsWith("EW")) {
            var elEnc = document.getElementById(idId);
            if (elEnc) {
                aplicarEstilo(elEnc, datosEnclav[idId] == 1);
            }
        }
    });
}

function procesarDatosTrafico(datosTrafico, sufijoPanel) {
    if (!datosTrafico) return;
    
    var mapeoLeds = {
        "CDV1": "led-CDV1_" + sufijoPanel, "CDV2": "led-CDV2_" + sufijoPanel,
        "RF":   "led-RF_" + sufijoPanel,     "RU":   "led-RU_" + sufijoPanel
    };
    
    Object.keys(mapeoLeds).forEach(function(claveKey) {
        var ledEl = document.getElementById(mapeoLeds[claveKey]);
        if (ledEl) {
            var valor = datosTrafico[claveKey] !== undefined ? datosTrafico[claveKey] : datosTrafico[claveKey.split('').join('.')];
            if (valor === 1 || valor === "1") {
                ledEl.className = (claveKey === "CDV1" || claveKey === "CDV2") ? "led-10mm l-on-w" : "led-10mm l-on-b";
            } else {
                ledEl.className = "led-10mm";
            }
        }
    });
}

function procesarBloqueSenales(dataSenales) {
    if(!dataSenales) return;
    Object.keys(dataSenales).forEach(function(id) {
        var idHtml = id.trim();
        var base = document.getElementById(idHtml + '_base') || document.getElementById(idHtml.toLowerCase() + '_base') || document.getElementById(idHtml.toUpperCase() + '_base');
        
        if(!base) {
            var idL = idHtml.toLowerCase();
            if(idL === "sa-bel") base = document.getElementById("sA-BEL_base");
            if(idL === "sb-bel") base = document.getElementById("sB-BEL_base");
            if(idL === "sy-bel") base = document.getElementById("sY-BEL_base");
            if(idL === "sz-bel") base = document.getElementById("sZ-BEL_base");
        }

        if(base) {
            base.classList.remove('f-rojo', 'f-verde', 'f-maniobra');
            var estado = dataSenales[id];
            if(estado === 1 || estado === "1") base.classList.add('f-verde');
            else if(estado === 2 || estado === "2") base.classList.add('f-maniobra');
            else base.classList.add('f-rojo');
        }
    });
}

db.ref('cabinas').on('value', function(snapshot) {
    var cabinas = snapshot.val();
    if(!snapshot.exists() || !cabinas) return;

    var dataBel = cabinas.belgrano;

    if (dataBel && dataBel.status) {
        var led = document.getElementById('indicadorBelgrano');
        if (led) {
            if (Number(dataBel.status.status) === 1) {
                led.className = 'led-status led-on';
            } else {
                led.className = 'led-status led-off';
            }
        }

        if (dataBel.vias) {
            Object.keys(dataBel.vias).forEach(function(id) {
                var val = dataBel.vias[id];
                setEstadoCircuito(id, val);
            });
            if(dataBel.vias["w1pm"] !== undefined) w1_estado = dataBel.vias["w1pm"];
            if(dataBel.vias["w2pm"] !== undefined) w2_estado = dataBel.vias["w2pm"];
        }
        if (dataBel.senales) { procesarBloqueSenales(dataBel.senales); }
        if (dataBel.cambios) {
            if (dataBel.cambios.W12 !== undefined) curW = dataBel.cambios.W12.toString();
            if (dataBel.cambios.AW12 !== undefined) flagAveria_Bel = parseInt(dataBel.cambios.AW12);
        }
        procesarDatosTrafico(dataBel.trafico || dataBel.datos_trafico, "B");
        procesarEnclavamientosCambios(dataBel.enclavamientos);
    }
});

function setEstadoCircuito(idCircuito, numEstado) {
    const el = document.getElementById(idCircuito) || document.getElementById(idCircuito.toLowerCase()) || document.getElementById("c" + idCircuito.toLowerCase());
    if (!el) return;

    const estados = { 
        3: 'via-fantasma', 0: 'libreconI', 1: 'ocupado', 2: 'libresinI', 
        4: 'maniobra', 5: 'libredeslizamiento', 6: 'zonasinseñalizar'
    };

    const esArriba = el.classList.contains('v-arriba');
    const esAbajo = el.classList.contains('v-abajo');
    const esDiagonal = el.classList.contains('diagonal');
    
    let nuevasClases = 'via';
    if (esArriba) nuevasClases += ' v-arriba';
    if (esAbajo) nuevasClases += ' v-abajo';
    if (esDiagonal) nuevasClases += ' diagonal';
    
    el.className = nuevasClases; 
    
    if (estados[numEstado]) {
        el.classList.add(estados[numEstado]);
    }
}

function anclarNombres() {
    document.querySelectorAll('.via').forEach(via => {
        if (!via.dataset.nombre) return;
        
        const label = document.createElement('span');
        label.className = 'nombre-via-label';
        label.innerText = via.dataset.nombre;
        
        const container = document.querySelector('.map-container');
        
        label.style.left = (via.offsetLeft + (via.offsetWidth / 2)) + 'px';
        label.style.transform = 'translateX(-50%)';
        
        if (via.classList.contains('v-arriba')) {
            label.style.top = (via.offsetTop - 15) + 'px';
        } else {
            label.style.top = (via.offsetTop + 12) + 'px';
        }
        
        container.appendChild(label);
    });
}
